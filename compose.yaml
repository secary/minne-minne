services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: minne
      POSTGRES_USER: minne
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minne}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minne -d minne"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
