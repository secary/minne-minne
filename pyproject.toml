[project]
name = "minne-minne"
version = "0.1.0"
description = "Kantai Collection LLM Wiki knowledge service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "python-frontmatter>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
source = [
    "backend.app.ingestion",
    "backend.app.worker",
]

[tool.coverage.report]
show_missing = true
fail_under = 61

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
